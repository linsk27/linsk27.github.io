<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1270" width="720" height="1270" role="img" aria-labelledby="title desc">
  <title id="title">DigitalPlat、Cloudflare 与 Vercel 的两阶段访问链路</title>
  <desc id="desc">访问 linsk27.dpdns.org 时，浏览器先通过递归 DNS、DigitalPlat 父区委派和 Cloudflare 权威 DNS 获得答案。DNS 阶段结束后，浏览器再按 Cloudflare 记录模式通过代理或 DNS-only 路径访问 Vercel 源站。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 600; fill: #5B6472; }
      .pill { font-size: 12px; font-weight: 800; }
      .zone { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .zone-index { font-size: 13px; font-weight: 900; fill: white; }
      .zone-title { font-size: 20px; font-weight: 800; fill: #202A44; }
      .card-title { font-size: 17px; font-weight: 800; }
      .card-detail { font-size: 14px; font-weight: 550; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 650; fill: #5B6472; }
      .edge { font-size: 11px; font-weight: 750; fill: #5B6472; }
      .strip { font-size: 10.5px; font-weight: 750; }

    .step-index { font-size: 10px; font-weight: 900; fill: #5B6472; letter-spacing: 1px; }
    .actor { font-size: 13px; font-weight: 900; }
    .activity-title { font-size: 17px; font-weight: 800; fill: #202A44; }
    .origin-title { font-size: 18px; font-weight: 850; fill: white; }
    .origin-detail { font-size: 13px; font-weight: 650; fill: #F8E9EC; }

    </style>
  </defs>
  <rect width="720" height="1270" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">REQUEST TRACE · DIGITALPLAT × CLOUDFLARE</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">打开本站时，DNS 与网页请求分别经过谁？</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">先找到连接目标，再发起 HTTPS；两个阶段不会同时发生。</tspan>
  </text>
  <g>
    <rect x="40" y="151" width="118" height="30" rx="15" fill="#E8F2ED"/>
    <text x="99" y="171" class="pill" fill="#2F6B55" text-anchor="middle">DNS：找地址</text>
  </g>
  <g>
    <rect x="168" y="151" width="132" height="30" rx="15" fill="#EAF0F7"/>
    <text x="234" y="171" class="pill" fill="#1B365D" text-anchor="middle">HTTPS：取网页</text>
  </g>
  <g>
    <rect x="310" y="151" width="166" height="30" rx="15" fill="#FFF3DF"/>
    <text x="393" y="171" class="pill" fill="#9B682F" text-anchor="middle">记录模式决定路径</text>
  </g>
  <g>
    <rect x="28" y="195" width="664" height="590" rx="22" class="zone"/>
    <rect x="28" y="195" width="8" height="590" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="232" r="18" fill="#2F6B55"/>
    <text x="62" y="239" class="zone-index" text-anchor="middle">01</text>
    <text x="92" y="239" class="zone-title">DNS 查询阶段</text>
    <text x="670" y="237" class="meta" text-anchor="end">查询 / 回答</text>
  </g>
  <path d="M 72 300 V 660" fill="none" stroke="#2F6B55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  />
  <circle cx="72" cy="293" r="7" fill="#1B365D"/>
  <text x="72" y="262" class="step-index" text-anchor="middle">01</text>
  <g>
    <rect x="104" y="250" width="564" height="86" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>
    <text x="124" y="280" class="actor" fill="#1B365D">浏览器</text>
    <text x="340" y="280" class="activity-title">询问域名对应的地址</text>
    <text x="124" y="311" class="card-detail">目标：linsk27.dpdns.org</text>
  </g>
  <circle cx="72" cy="408" r="7" fill="#2F6B55"/>
  <text x="72" y="377" class="step-index" text-anchor="middle">02</text>
  <g>
    <rect x="104" y="365" width="564" height="86" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="124" y="395" class="actor" fill="#2F6B55">递归 DNS</text>
    <text x="340" y="395" class="activity-title">沿 DNS 层级查找权威答案</text>
    <text x="124" y="426" class="card-detail">缓存未命中时，继续询问父级 DNS</text>
  </g>
  <circle cx="72" cy="523" r="7" fill="#2F6B55"/>
  <text x="72" y="492" class="step-index" text-anchor="middle">03</text>
  <g>
    <rect x="104" y="480" width="564" height="86" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="124" y="510" class="actor" fill="#2F6B55">DigitalPlat 父区</text>
    <text x="340" y="510" class="activity-title">返回 Cloudflare nameserver 委派</text>
    <text x="124" y="541" class="card-detail">只决定“去问谁”，不托管本站网页</text>
  </g>
  <circle cx="72" cy="638" r="7" fill="#9B682F"/>
  <text x="72" y="607" class="step-index" text-anchor="middle">04</text>
  <g>
    <rect x="104" y="595" width="564" height="86" rx="15" fill="#FFF3DF" stroke="#9B682F" stroke-width="1.7"/>
    <text x="124" y="625" class="actor" fill="#9B682F">Cloudflare 权威 DNS</text>
    <text x="340" y="625" class="activity-title">按 DNS 记录模式给出答案</text>
    <text x="124" y="656" class="card-detail">代理记录与 DNS-only 记录会引出不同连接路径</text>
  </g>
  <path d="M 72 293 H 92" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 72 408 H 92" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 72 523 H 92" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 72 638 H 92" fill="none" stroke="#9B682F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="104" y="710" width="564" height="48" rx="12" fill="#E8F2ED"/><text x="124" y="740" class="strip" fill="#2F6B55">DNS 答案返回浏览器，DNS 阶段到此结束</text><text x="650" y="740" class="strip" fill="#2F6B55" text-anchor="end">不会返回网页正文</text>
  <g>
    <rect x="28" y="810" width="664" height="410" rx="22" class="zone"/>
    <rect x="28" y="810" width="8" height="410" rx="4" fill="#1B365D"/>
    <circle cx="62" cy="847" r="18" fill="#1B365D"/>
    <text x="62" y="854" class="zone-index" text-anchor="middle">02</text>
    <text x="92" y="854" class="zone-title">HTTPS 请求阶段</text>
    <text x="670" y="852" class="meta" text-anchor="end">连接 / 返回网页</text>
  </g><g>
  <rect x="150" y="870" width="420" height="74" rx="37" fill="#EAF0F7" stroke="#1B365D" stroke-width="2"/>
  <text x="360" y="899" class="activity-title" text-anchor="middle">浏览器另起 HTTPS 连接</text>
  <text x="360" y="925" class="card-detail" text-anchor="middle">分支条件来自 Cloudflare 的 DNS 记录模式</text>
</g>
  <path d="M 360 944 V 972 H 196 V 990" fill="none" stroke="#9B682F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 360 944 V 972 H 524 V 990" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="196" y="980" class="edge" text-anchor="middle" fill="#9B682F">橙云代理</text><text x="524" y="980" class="edge" text-anchor="middle" fill="#1B365D">DNS-only</text>
  <g>
    <rect x="52" y="995" width="288" height="102" rx="14" fill="#FFF3DF" stroke="#9B682F" stroke-width="1.7" />
    <text x="70" y="1025" class="card-title" fill="#9B682F">Cloudflare Edge</text>

  <text x="70" y="1053" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">浏览器先连边缘节点</tspan><tspan x="70" dy="23">TLS · CDN · 反向代理到源站</tspan>
  </text>

  </g>
  <g>
    <rect x="380" y="995" width="288" height="102" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="398" y="1025" class="card-title" fill="#1B365D">浏览器直连源站</text>

  <text x="398" y="1053" class="card-detail" text-anchor="start">
    <tspan x="398" dy="0">不经过 Cloudflare 反向代理</tspan><tspan x="398" dy="23">本站实测：DNS-only → Vercel</tspan>
  </text>

  </g>
  <path d="M 196 1097 V 1122 H 360 V 1134" fill="none" stroke="#9B682F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 524 1097 V 1122 H 360 V 1134" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><g>
  <rect x="170" y="1138" width="380" height="62" rx="14" fill="#7B3F4A"/>
  <text x="190" y="1167" class="origin-title">Vercel 源站</text>
  <text x="190" y="1190" class="origin-detail">绑定域名，最终返回 HTML / CSS / JS</text>
</g><text x="40" y="1249" class="foot">关键边界：DigitalPlat 负责父区委派；Cloudflare 负责权威 DNS；Vercel 负责返回本站内容。</text>
</svg>