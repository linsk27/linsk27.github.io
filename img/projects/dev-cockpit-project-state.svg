<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1190" width="720" height="1190" role="img" aria-labelledby="title desc">
  <title id="title">Dev Cockpit 的 core、server、Web、CLI 与 Electron 职责边界</title>
  <desc id="desc">packages/core 从目录静态信号生成 Project 基础模型，packages/server 使用进程、端口、HTTP 和日志证据补全运行时信息。CLI 直接消费 core；Web 在接收 server API 后定义自己的 ProjectRuntimeMode 展示映射，Electron 启动本地 server 并承载同一套 Web。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 600; fill: #5B6472; }
      .pill { font-size: 12px; font-weight: 800; }
      .zone { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .zone-index { font-size: 13px; font-weight: 900; fill: white; }
      .zone-title { font-size: 20px; font-weight: 800; fill: #202A44; }
      .card-title { font-size: 17px; font-weight: 800; }
      .card-detail { font-size: 14px; font-weight: 550; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 650; fill: #5B6472; }
      .edge { font-size: 11px; font-weight: 750; fill: #5B6472; }
      .strip { font-size: 10.5px; font-weight: 750; }

    .shell-title { font-size: 14px; font-weight: 850; }

    </style>
  </defs>
  <rect width="720" height="1190" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">ARCHITECTURE MAP · DEV COCKPIT</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">哪些事实真正共享，哪些状态只属于界面？</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">core 建立项目事实；server 补机器现场；Web 再把事实翻译成界面状态。</tspan>
  </text>
  <g>
    <rect x="40" y="151" width="126" height="30" rx="15" fill="#E8F2ED"/>
    <text x="103" y="171" class="pill" fill="#2F6B55" text-anchor="middle">共享：项目模型</text>
  </g>
  <g>
    <rect x="176" y="151" width="132" height="30" rx="15" fill="#EAF0F7"/>
    <text x="242" y="171" class="pill" fill="#1B365D" text-anchor="middle">运行时：服务端</text>
  </g>
  <g>
    <rect x="318" y="151" width="146" height="30" rx="15" fill="#F1EDF4"/>
    <text x="391" y="171" class="pill" fill="#6D587A" text-anchor="middle">展示状态：Web</text>
  </g>
  <g>
    <rect x="28" y="195" width="664" height="315" rx="22" class="zone"/>
    <rect x="28" y="195" width="8" height="315" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="232" r="18" fill="#2F6B55"/>
    <text x="62" y="239" class="zone-index" text-anchor="middle">01</text>
    <text x="92" y="239" class="zone-title">packages/core · 可复用基础模型</text>
    <text x="670" y="237" class="meta" text-anchor="end">不依赖界面</text>
  </g>
  <g>
    <rect x="28" y="535" width="664" height="335" rx="22" class="zone"/>
    <rect x="28" y="535" width="8" height="335" rx="4" fill="#1B365D"/>
    <circle cx="62" cy="572" r="18" fill="#1B365D"/>
    <text x="62" y="579" class="zone-index" text-anchor="middle">02</text>
    <text x="92" y="579" class="zone-title">packages/server · 机器现场补全</text>
    <text x="670" y="577" class="meta" text-anchor="end">本机证据</text>
  </g>
  <g>
    <rect x="28" y="895" width="664" height="245" rx="22" class="zone"/>
    <rect x="28" y="895" width="8" height="245" rx="4" fill="#6D587A"/>
    <circle cx="62" cy="932" r="18" fill="#6D587A"/>
    <text x="62" y="939" class="zone-index" text-anchor="middle">03</text>
    <text x="92" y="939" class="zone-title">消费入口 · 各自承担展示职责</text>
    <text x="670" y="937" class="meta" text-anchor="end">CLI / Web / Electron</text>
  </g>
  <path d="M 572 370 V 585 H 505 V 600" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 302 655 H 326" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 503 710 V 745 H 360 V 760" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 360 840 V 920 H 503 V 954" fill="none" stroke="#6D587A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="430" y="913" class="edge" text-anchor="middle" fill="#6D587A">enriched Project</text>
  <g>
    <rect x="52" y="260" width="180" height="110" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="70" y="290" class="card-title" fill="#2F6B55">目录静态信号</text>

  <text x="70" y="318" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">标记文件 · scripts</tspan><tspan x="70" dy="23">Git · 编辑器配置</tspan>
  </text>
    <text x="70" y="356" class="note">FileSystem / Process adapters</text>
  </g>
  <g>
    <rect x="264" y="260" width="180" height="110" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="282" y="290" class="card-title" fill="#2F6B55">Core Scanner</text>

  <text x="282" y="318" class="card-detail" text-anchor="start">
    <tspan x="282" dy="0">技术栈 · 命令</tspan><tspan x="282" dy="23">候选端口 · Python 声明</tspan>
  </text>

  </g>
  <g>
    <rect x="476" y="260" width="192" height="110" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="494" y="290" class="card-title" fill="#2F6B55">Project 基础模型</text>

  <text x="494" y="318" class="card-detail" text-anchor="start">
    <tspan x="494" dy="0">kind · commands · git</tspan><tspan x="494" dy="23">ports · lastRun · lastError</tspan>
  </text>

  </g>
  <path d="M 232 315 H 252" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 444 315 H 464" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="52" y="405" width="616" height="74" rx="13" fill="#E8F2ED"/><text x="70" y="432" class="card-title" fill="#2F6B55">共享边界</text><text x="70" y="457" class="card-detail">扫描规则、Project 字段和 API contracts 属于 core；任何入口都可以复用这些事实。</text>
  <g>
    <rect x="52" y="600" width="250" height="110" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="70" y="630" class="card-title" fill="#1B365D">机器动态证据</text>

  <text x="70" y="658" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">托管进程 · 最近日志</tspan><tspan x="70" dy="23">PID / 端口归属 · HTTP 探测</tspan>
  </text>
    <text x="70" y="696" class="note">真实监听 ≠ 当前项目在线</text>
  </g>
  <g>
    <rect x="338" y="600" width="330" height="110" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="356" y="630" class="card-title" fill="#1B365D">enrichProject()</text>

  <text x="356" y="658" class="card-detail" text-anchor="start">
    <tspan x="356" dy="0">合并托管运行、外部服务与日志端口</tspan><tspan x="356" dy="23">过滤迟到错误、陈旧端口和错误归属</tspan>
  </text>

  </g>
  <g>
    <rect x="230" y="760" width="260" height="96" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="248" y="790" class="card-title" fill="#1B365D">Server API 中的 Project</text>

  <text x="248" y="818" class="card-detail" text-anchor="start">
    <tspan x="248" dy="0">基础模型 + 当前机器运行证据</tspan>
  </text>
    <text x="248" y="842" class="note">仍是 Project；Web UI 状态未在此定义</text>
  </g>
  <g>
    <rect x="52" y="965" width="250" height="140" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="70" y="995" class="card-title" fill="#2F6B55">CLI</text>

  <text x="70" y="1023" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">直接 import packages/core</tspan><tspan x="70" dy="23">扫描 / doctor / 文本输出</tspan>
  </text>
    <text x="70" y="1091" class="note">复用 Project 事实，不经过 server enrich</text>
  </g>
  <g>
    <rect x="338" y="960" width="330" height="140" rx="14" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7" />
    <text x="356" y="990" class="card-title" fill="#6D587A">Local Server → Vue Web</text>

  <text x="356" y="1018" class="card-detail" text-anchor="start">
    <tspan x="356" dy="0">API 送来补全后的 Project</tspan><tspan x="356" dy="23">Web 映射 managed / detected / stale</tspan><tspan x="356" dy="23">failed / idle → 文案与操作提示</tspan>
  </text>
    <text x="356" y="1086" class="note">Electron：启动同一 server，并加载同一 Web</text>
  </g><text x="40" y="1169" class="foot">正确复用的是“可验证事实与扫描规则”；Web 的五种运行模式只是消费这些事实的展示投影。</text>
</svg>