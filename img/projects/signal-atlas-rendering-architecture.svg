<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="720" height="1320" role="img" aria-labelledby="title desc">
  <title id="title">Signal Atlas 真实网页嵌入架构图</title>
  <desc id="desc">图中分为渲染流、投影流和网络取页三部分。InteractionRouter 与相机状态机驱动共享 Camera，WebGLRenderer 与 CSS3DRenderer 使用同一视角。桌面 iframe 中的 WindowManager 通过 postMessage 发送窗口矩形，父页面投影协调器定位固定 DOM Portal 并用多边形裁剪显示真实 Interview iframe。该 iframe 通过 Vercel 同源重写请求上游页面，并在超时或失败时受控重试。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 520; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 650; fill: #5B6472; }
      .pill { font-size: 13px; font-weight: 800; }
      .section { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .section-index { font-size: 13px; font-weight: 900; fill: white; }
      .section-title { font-size: 20px; font-weight: 820; fill: #202A44; }
      .section-kicker { font-size: 12px; font-weight: 750; fill: #5B6472; }
      .card-title { font-size: 17px; font-weight: 820; }
      .card-detail { font-size: 14px; font-weight: 560; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 680; fill: #5B6472; }
      .badge { font-size: 11.5px; font-weight: 820; fill: white; }
      .edge { font-size: 11.5px; font-weight: 760; fill: #5B6472; }
      .strip { font-size: 12px; font-weight: 760; }
      .divider-label { font-size: 11.5px; font-weight: 720; fill: #8A93A1; }
    </style>
  </defs>
  <rect width="720" height="1320" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">SYSTEM MAP · SIGNAL ATLAS</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">一个 3D 桌面，怎样稳定容纳真实网页</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">渲染层画场景，投影层同步窗口，网络层把真实页面取回来。</tspan>
  </text>
  <g>
    <rect x="40" y="151" width="112" height="32" rx="16" fill="#EAF0F7"/>
    <text x="96" y="173" class="pill" fill="#1B365D" text-anchor="middle">渲染流</text>
  </g>
  <g>
    <rect x="162" y="151" width="112" height="32" rx="16" fill="#E8F2ED"/>
    <text x="218" y="173" class="pill" fill="#2F6B55" text-anchor="middle">投影流</text>
  </g>
  <g>
    <rect x="284" y="151" width="124" height="32" rx="16" fill="#FFF3DF"/>
    <text x="346" y="173" class="pill" fill="#9B682F" text-anchor="middle">网络取页</text>
  </g><text x="678" y="172" class="meta" text-anchor="end">WebGL + CSS3D + DOM Portal</text>
  <g>
    <rect x="28" y="195" width="664" height="380" rx="22" class="section"/>
    <rect x="28" y="195" width="8" height="380" rx="4" fill="#1B365D"/>
    <circle cx="62" cy="233" r="18" fill="#1B365D"/>
    <text x="62" y="240" class="section-index" text-anchor="middle">01</text>
    <text x="92" y="240" class="section-title">同一相机驱动两种渲染层</text>
    <text x="668" y="238" class="section-kicker" text-anchor="end">输入与画面</text>
  </g>
  <g>
    <rect x="52" y="255" width="174" height="100" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="70" y="288" class="card-title" fill="#1B365D">交互输入</text>

  <text x="70" y="319" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">指针 · 滚轮 · 键盘</tspan><tspan x="70" dy="25">统一交给路由层</tspan>
  </text>

  </g>
  <g>
    <rect x="274" y="255" width="174" height="100" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="292" y="288" class="card-title" fill="#2F6B55">InteractionRouter</text>

  <text x="292" y="319" class="card-detail" text-anchor="start">
    <tspan x="292" dy="0">识别当前交互目标</tspan><tspan x="292" dy="25">协调场景与桌面事件</tspan>
  </text>

  </g>
  <g>
    <rect x="496" y="255" width="172" height="100" rx="15" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7"/>

    <text x="514" y="288" class="card-title" fill="#6D587A">相机状态机</text>

  <text x="514" y="319" class="card-detail" text-anchor="start">
    <tspan x="514" dy="0">维护相机状态</tspan><tspan x="514" dy="25">驱动视角切换</tspan>
  </text>

  </g><path d="M 226 305 H 262" fill="none" stroke="#1B365D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 448 305 H 484" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="250" y="294" class="edge" text-anchor="middle">路由</text><text x="472" y="294" class="edge" text-anchor="middle">状态</text><g>
  <rect x="242" y="382" width="236" height="56" rx="18" fill="#1B365D"/>
  <text x="360" y="407" class="badge" text-anchor="middle">共享 Camera</text>
  <text x="360" y="427" class="edge" text-anchor="middle" style="fill:#FFFFFF;opacity:.82">相同位置 · 朝向 · 投影参数</text>
</g><path d="M 582 355 V 370 H 478 V 382" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/>
  <g>
    <rect x="90" y="472" width="238" height="76" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="108" y="505" class="card-title" fill="#1B365D">WebGLRenderer</text>

  <text x="108" y="536" class="card-detail" text-anchor="start">
    <tspan x="108" dy="0">Three.js 场景与 3D 外壳</tspan>
  </text>

  </g>
  <g>
    <rect x="392" y="472" width="238" height="76" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="410" y="505" class="card-title" fill="#2F6B55">CSS3DRenderer</text>

  <text x="410" y="536" class="card-detail" text-anchor="start">
    <tspan x="410" dy="0">DOM 桌面与可交互界面</tspan>
  </text>

  </g><path d="M 314 438 V 454 H 209 V 460" fill="none" stroke="#1B365D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 406 438 V 454 H 511 V 460" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="360" y="563" class="strip" fill="#1B365D" text-anchor="middle">两层共享相机后叠合：3D 场景保持空间感，DOM 保持真实交互能力</text>
  <g>
    <rect x="28" y="595" width="664" height="420" rx="22" class="section"/>
    <rect x="28" y="595" width="8" height="420" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="633" r="18" fill="#2F6B55"/>
    <text x="62" y="640" class="section-index" text-anchor="middle">02</text>
    <text x="92" y="640" class="section-title">窗口几何从桌面 iframe 回到父页面</text>
    <text x="668" y="638" class="section-kicker" text-anchor="end">跨 iframe 投影</text>
  </g><g>
  <rect x="52" y="657" width="616" height="122" rx="16" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.6"/>
  <text x="72" y="684" class="strip" fill="#2F6B55">桌面 iframe</text>
  <rect x="72" y="700" width="218" height="60" rx="12" fill="#FFFFFF" stroke="#2F6B55" stroke-width="1.4"/>
  <text x="88" y="725" class="card-title" fill="#2F6B55">WindowManager</text>
  <text x="88" y="748" class="card-detail">窗口移动 / 缩放 / 层级</text>
  <rect x="350" y="700" width="286" height="60" rx="12" fill="#FFFFFF" stroke="#6D587A" stroke-width="1.4"/>
  <text x="366" y="725" class="card-title" fill="#6D587A">postMessage</text>
  <text x="366" y="748" class="card-detail">发送浏览器窗口 rect</text>
</g><path d="M 290 730 H 338" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="314" y="718" class="edge" text-anchor="middle">几何变化</text>
  <g>
    <path d="M 64 804 L 656 804" fill="none" stroke="#CDD5DF" stroke-width="1.5" stroke-dasharray="6 7"/>
    <rect x="292" y="791" width="136" height="26" rx="13" fill="#FFFFFF"/><text x="360" y="809" class="divider-label" text-anchor="middle">iframe 边界</text>
  </g>
  <g>
    <rect x="52" y="834" width="180" height="102" rx="15" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7"/>

    <text x="70" y="867" class="card-title" fill="#6D587A">投影协调器</text>

  <text x="70" y="898" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">接收 window rect</tspan><tspan x="70" dy="25">换算位置与可见区域</tspan>
  </text>

  </g>
  <g>
    <rect x="270" y="834" width="180" height="102" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="288" y="867" class="card-title" fill="#1B365D">固定 DOM Portal</text>

  <text x="288" y="898" class="card-detail" text-anchor="start">
    <tspan x="288" dy="0">挂在父页面</tspan><tspan x="288" dy="25">脱离 3D 纹理渲染</tspan>
  </text>

  </g>
  <g>
    <rect x="488" y="834" width="180" height="102" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="506" y="867" class="card-title" fill="#2F6B55">Interview iframe</text>

  <text x="506" y="898" class="card-detail" text-anchor="start">
    <tspan x="506" dy="0">真实网页实例</tspan><tspan x="506" dy="25">按窗口区域显示</tspan>
  </text>

  </g><path d="M 493 779 V 812 H 142 V 822" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 232 885 H 258" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 450 885 H 476" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="251" y="874" class="edge" text-anchor="middle">定位</text><text x="469" y="874" class="edge" text-anchor="middle">承载</text><g>
  <rect x="52" y="955" width="616" height="43" rx="11" fill="#F1EDF4"/>
  <path d="M 76 968 L 118 968 L 126 985 L 90 990 L 70 979 Z" fill="none" stroke="#6D587A" stroke-width="1.7"/>
  <text x="144" y="982" class="strip" fill="#6D587A">polygon clipping：窗口移动时，只露出浏览器窗口对应的多边形区域</text>
</g>
  <g>
    <rect x="28" y="1035" width="664" height="245" rx="22" class="section"/>
    <rect x="28" y="1035" width="8" height="245" rx="4" fill="#9B682F"/>
    <circle cx="62" cy="1073" r="18" fill="#9B682F"/>
    <text x="62" y="1080" class="section-index" text-anchor="middle">03</text>
    <text x="92" y="1080" class="section-title">真实页面通过同源入口取回</text>
    <text x="668" y="1078" class="section-kicker" text-anchor="end">加载与恢复</text>
  </g>
  <g>
    <rect x="52" y="1094" width="174" height="102" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="70" y="1127" class="card-title" fill="#2F6B55">Interview iframe</text>

  <text x="70" y="1158" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">从父页面发起请求</tspan><tspan x="70" dy="25">使用站内同源地址</tspan>
  </text>

  </g>
  <g>
    <rect x="273" y="1094" width="174" height="102" rx="15" fill="#FFF3DF" stroke="#9B682F" stroke-width="1.7"/>

    <text x="291" y="1127" class="card-title" fill="#9B682F">Vercel Rewrite</text>

  <text x="291" y="1158" class="card-detail" text-anchor="start">
    <tspan x="291" dy="0">接住站内路径</tspan><tspan x="291" dy="25">转发至上游页面</tspan>
  </text>

  </g>
  <g>
    <rect x="494" y="1094" width="174" height="102" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="512" y="1127" class="card-title" fill="#1B365D">上游内容</text>

  <text x="512" y="1158" class="card-detail" text-anchor="start">
    <tspan x="512" dy="0">返回 HTML / 资源</tspan><tspan x="512" dy="25">交给真实 iframe 展示</tspan>
  </text>

  </g><path d="M 226 1145 H 261" fill="none" stroke="#9B682F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 447 1145 H 482" fill="none" stroke="#9B682F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="244" y="1133" class="edge" text-anchor="middle">同源</text><text x="465" y="1133" class="edge" text-anchor="middle">转发</text><g>
  <rect x="52" y="1214" width="616" height="46" rx="11" fill="#F8E9EC"/>
  <text x="70" y="1243" class="strip" fill="#7B3F4A">加载保护　超时 / 失败 → 受控重试；成功 → Portal 继续按投影窗口显示</text>
</g><text x="40" y="1303" class="foot">实线：主数据流　·　虚线边界：iframe 上下文切换　·　网页没有被“画进”WebGL 纹理</text>
</svg>