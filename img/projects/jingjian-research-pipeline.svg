<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1650" width="720" height="1650" role="img" aria-labelledby="title desc">
  <title id="title">竞见淘宝竞品调研 PPT 智能体流程图</title>
  <desc id="desc">从研究简报和依赖预检开始，经过品牌研究、淘宝商品串行采集、人工验证、确定性检查和局部修复，最终生成一份在线预览一致的 PPT，并通过阶段检查点和商品槽位记录支持断点续跑。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 600; fill: #5B6472; }
      .pill { font-size: 12px; font-weight: 800; }
      .stage { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .stage-index { font-size: 13px; font-weight: 900; fill: white; }
      .stage-title { font-size: 20px; font-weight: 800; fill: #202A44; }
      .card-title { font-size: 17px; font-weight: 800; }
      .card-detail { font-size: 14px; font-weight: 550; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 650; fill: #5B6472; }
      .edge { font-size: 11px; font-weight: 750; fill: #5B6472; }
      .strip { font-size: 10.5px; font-weight: 750; }
    </style>
  </defs>
  <rect width="720" height="1650" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">SYSTEM MAP · 竞见</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">一次竞品调研，怎样稳定变成一份 PPT</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">固定流水线负责顺序，模型负责理解，程序负责证据、状态与失败处理。</tspan>
  </text><g><rect x="40" y="151" width="114" height="30" rx="15" fill="#E8F2ED"/><text x="97" y="171" class="pill" fill="#2F6B55" text-anchor="middle">自动主流程</text></g><g><rect x="164" y="151" width="116" height="30" rx="15" fill="#FFF3DF"/><text x="222" y="171" class="pill" fill="#9B682F" text-anchor="middle">人工接管</text></g><g><rect x="290" y="151" width="132" height="30" rx="15" fill="#F1EDF4"/><text x="356" y="171" class="pill" fill="#6D587A" text-anchor="middle">状态与恢复</text></g><g><rect x="432" y="151" width="118" height="30" rx="15" fill="#F8E9EC"/><text x="491" y="171" class="pill" fill="#7B3F4A" text-anchor="middle">质量门禁</text></g><text x="678" y="171" class="meta" text-anchor="end">单机 · 单正式任务</text>
  <g>
    <rect x="28" y="195" width="664" height="210" rx="22" class="stage"/>
    <rect x="28" y="195" width="8" height="210" rx="4" fill="#1B365D"/>
    <circle cx="62" cy="232" r="18" fill="#1B365D"/>
    <text x="62" y="239" class="stage-index" text-anchor="middle">01</text>
    <text x="92" y="239" class="stage-title">建立任务与环境预检</text>
  </g>
  <g>
    <rect x="52" y="250" width="274" height="118" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>
    <text x="70" y="280" class="card-title" fill="#1B365D">研究简报</text>

  <text x="70" y="308" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">主题 · 品类 · 市场</tspan><tspan x="70" dy="23">价格范围 · 关注重点 · 调研规模</tspan>
  </text>

  </g>
  <g>
    <rect x="394" y="250" width="274" height="118" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="412" y="280" class="card-title" fill="#2F6B55">依赖预检</text>

  <text x="412" y="308" class="card-detail" text-anchor="start">
    <tspan x="412" dy="0">内容分析服务 · 本机浏览器</tspan><tspan x="412" dy="23">淘宝登录态 · 截图 Worker</tspan>
  </text>
    <text x="412" y="354" class="note">未就绪：提示处理，不创建空转任务</text>
  </g><path d="M 326 309 H 382" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="354" y="298" class="edge" text-anchor="middle">创建前</text><text x="52" y="390" class="note">同一提交键 + 同一请求会返回原任务，避免重复创建。</text>
  <g>
    <rect x="28" y="425" width="664" height="390" rx="22" class="stage"/>
    <rect x="28" y="425" width="8" height="390" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="462" r="18" fill="#2F6B55"/>
    <text x="62" y="469" class="stage-index" text-anchor="middle">02</text>
    <text x="92" y="469" class="stage-title">品牌与市场研究</text>
  </g>
  <g>
    <rect x="52" y="482" width="188" height="100" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="70" y="512" class="card-title" fill="#2F6B55">品类理解</text>

  <text x="70" y="540" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">品类边界</tspan><tspan x="70" dy="23">候选品牌</tspan>
  </text>

  </g>
  <g>
    <rect x="266" y="482" width="188" height="100" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="284" y="512" class="card-title" fill="#2F6B55">品牌核验</text>

  <text x="284" y="540" class="card-detail" text-anchor="start">
    <tspan x="284" dy="0">市场相关性</tspan><tspan x="284" dy="23">锁定品牌顺序</tspan>
  </text>

  </g>
  <g>
    <rect x="480" y="482" width="188" height="100" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="498" y="512" class="card-title" fill="#2F6B55">品牌研究</text>

  <text x="498" y="540" class="card-detail" text-anchor="start">
    <tspan x="498" dy="0">画像 · 产品结构</tspan><tspan x="498" dy="23">公开来源链接</tspan>
  </text>

  </g><path d="M 240 532 H 254" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 454 532 H 468" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <g>
    <rect x="52" y="615" width="294" height="100" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>
    <text x="70" y="645" class="card-title" fill="#1B365D">横向洞察</text>

  <text x="70" y="673" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">价格带 · 卖点 · 视觉表达</tspan><tspan x="70" dy="23">形成市场洞察与设计建议</tspan>
  </text>

  </g>
  <g>
    <rect x="374" y="615" width="294" height="100" rx="14" fill="#F8E9EC" stroke="#7B3F4A" stroke-width="1.7"/>
    <text x="392" y="645" class="card-title" fill="#7B3F4A">内容校验</text>

  <text x="392" y="673" class="card-detail" text-anchor="start">
    <tspan x="392" dy="0">来源 · 结构 · 相关性</tspan><tspan x="392" dy="23">清理占位、重复与无依据内容</tspan>
  </text>

  </g><path d="M 574 582 V 600 H 199 V 603" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 346 665 H 362" fill="none" stroke="#7B3F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 521 715 V 742 H 199 V 727" fill="none" stroke="#7B3F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="356" y="760" class="edge" text-anchor="middle" fill="#7B3F4A">缺来源或不相关：回到对应研究步骤</text><rect x="52" y="772" width="616" height="28" rx="8" fill="#EAF0F7"/><text x="66" y="791" class="strip" fill="#1B365D">公开检索 + 大模型：负责阅读与归纳</text><text x="654" y="791" class="strip" fill="#2F6B55" text-anchor="end">品牌核验 / 研究最多 3 个并行 · 每完成 1 个立即保存</text>
  <g>
    <rect x="28" y="835" width="664" height="300" rx="22" class="stage"/>
    <rect x="28" y="835" width="8" height="300" rx="4" fill="#9B682F"/>
    <circle cx="62" cy="872" r="18" fill="#9B682F"/>
    <text x="62" y="879" class="stage-index" text-anchor="middle">03</text>
    <text x="92" y="879" class="stage-title">淘宝商品证据采集</text>
  </g>
  <g>
    <rect x="52" y="894" width="354" height="126" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
    <text x="70" y="924" class="card-title" fill="#2F6B55">商品筛选与串行采集</text>

  <text x="70" y="952" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">品牌 × 品类 × 价格 × 排除词</tspan><tspan x="70" dy="23">主图 · 页面价格 · 付款人数 · 规格 · 来源</tspan>
  </text>
    <text x="70" y="1006" class="note">单淘宝账号 · 单截图队列 · 成功槽位立即保存</text>
  </g>
  <g>
    <rect x="444" y="894" width="224" height="126" rx="14" fill="#FFF3DF" stroke="#9B682F" stroke-width="1.7"/>
    <text x="462" y="924" class="card-title" fill="#9B682F">人工验证面板</text>

  <text x="462" y="952" class="card-detail" text-anchor="start">
    <tspan x="462" dy="0">扫码 / 滑块 / 短信 / 点选</tspan><tspan x="462" dy="23">waiting_input → 处理后继续</tspan>
  </text>
    <text x="462" y="1006" class="note">不绕过平台验证</text>
  </g><path d="M 406 932 H 432" fill="none" stroke="#9B682F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><path d="M 444 988 H 420 V 1008 H 406" fill="none" stroke="#9B682F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="426" y="920" class="edge" text-anchor="middle" fill="#9B682F">触发</text><rect x="52" y="1048" width="616" height="66" rx="13" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.6"/><text x="70" y="1075" class="card-title" fill="#6D587A">图片与字段门禁</text><text x="70" y="1098" class="card-detail">解码 / 尺寸 / 重复 / 登录页 / 二维码 / 可见性；失败时只重采对应商品槽位。</text>
  <g>
    <rect x="28" y="1155" width="664" height="285" rx="22" class="stage"/>
    <rect x="28" y="1155" width="8" height="285" rx="4" fill="#7B3F4A"/>
    <circle cx="62" cy="1192" r="18" fill="#7B3F4A"/>
    <text x="62" y="1199" class="stage-index" text-anchor="middle">04</text>
    <text x="92" y="1199" class="stage-title">报告检查、局部修复与交付</text>
  </g>
  <g>
    <rect x="52" y="1214" width="172" height="112" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>
    <text x="70" y="1244" class="card-title" fill="#1B365D">页面渲染</text>

  <text x="70" y="1272" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">研究结论</tspan><tspan x="70" dy="23">+ 商品证据</tspan>
  </text>

  </g>
  <g>
    <rect x="260" y="1214" width="224" height="112" rx="14" fill="#F8E9EC" stroke="#7B3F4A" stroke-width="1.7"/>
    <text x="278" y="1244" class="card-title" fill="#7B3F4A">三类确定性检查</text>

  <text x="278" y="1272" class="card-detail" text-anchor="start">
    <tspan x="278" dy="0">内容产物</tspan><tspan x="278" dy="23">布局 ∥ 图片门禁</tspan>
  </text>

  </g>
  <g>
    <rect x="520" y="1214" width="148" height="112" rx="14" fill="#F8E9EC" stroke="#7B3F4A" stroke-width="1.7"/>
    <text x="538" y="1244" class="card-title" fill="#7B3F4A">正式交付</text>

  <text x="538" y="1272" class="card-detail" text-anchor="start">
    <tspan x="538" dy="0">在线预览</tspan><tspan x="538" dy="23">唯一一份 PPTX</tspan>
  </text>

  </g><path d="M 224 1270 H 248" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 484 1270 H 508" fill="none" stroke="#7B3F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 372 1326 V 1362 H 138 V 1338" fill="none" stroke="#7B3F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="255" y="1382" class="edge" text-anchor="middle" fill="#7B3F4A">可修内容 / 布局：再渲染（最多 3 轮）</text><path d="M 372 1326 V 1404 H 620 V 1338" fill="none" stroke="#7B3F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="520" y="1424" class="edge" text-anchor="middle" fill="#7B3F4A">无阻断问题：进入人工数据抽查与设计审稿</text><g>
  <rect x="28" y="1460" width="664" height="144" rx="22" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.8"/>
  <text x="52" y="1495" class="stage-title" fill="#6D587A">状态与恢复轨道</text>
  <text x="52" y="1526" class="card-detail">任务状态　queued → running ↔ waiting_input → completed / failed / cancelled</text>
  <text x="52" y="1555" class="card-detail">阶段检查点　复用同一请求中结构有效的研究结果；服务重启后从最近合法检查点继续</text>
  <text x="52" y="1584" class="card-detail">商品槽位　复用仍有效的成功图片，只重排缺失 / 失败槽位；dispatch_id 隔离迟到结果</text>
  <g><rect x="536" y="1474" width="132" height="30" rx="15" fill="#F1EDF4"/><text x="602" y="1494" class="pill" fill="#6D587A" text-anchor="middle">断点续跑不是重跑</text></g>
</g><text x="40" y="1630" class="foot">实线：正常推进　·　虚线：人工或修复回流　·　所有关键结论保留来源与采集时间</text>
</svg>