<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="720" height="1320" role="img" aria-labelledby="title desc">
  <title id="title">ProofPR 的三支证据输入与确定性审查门禁</title>
  <desc id="desc">本地或 GitHub 的 unified diff 经 parseUnifiedDiff 转为 DiffFile，PR 标题和正文形成 PullRequest 证据对象，.proofpr.yml 经 YAML 和 Zod 加载为 ProofPRConfig。三种输入分别进入确定性规则引擎，得到 findings、evidence score、review decision 与 review plan，再发布为 Markdown、JSON、HTML、SARIF 或 GitHub Action 输出。配置不进入 diff parser。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 600; fill: #5B6472; }
      .pill { font-size: 12px; font-weight: 800; }
      .zone { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .zone-index { font-size: 13px; font-weight: 900; fill: white; }
      .zone-title { font-size: 20px; font-weight: 800; fill: #202A44; }
      .card-title { font-size: 17px; font-weight: 800; }
      .card-detail { font-size: 14px; font-weight: 550; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 650; fill: #5B6472; }
      .edge { font-size: 11px; font-weight: 750; fill: #5B6472; }
      .strip { font-size: 10.5px; font-weight: 750; }

    .engine-title { font-size: 14px; font-weight: 850; }
    .lens-title { font-size: 14px; font-weight: 850; }
    .lens-detail { font-size: 11.5px; font-weight: 650; fill: #202A44; }
    .gate-mini { font-size: 10.5px; font-weight: 850; fill: white; }
    .gate-label { font-size: 9.5px; font-weight: 850; }

    </style>
  </defs>
  <rect width="720" height="1320" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">EVIDENCE GATE · PROOFPR</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">一个 PR 怎样变成可解释的审查门禁？</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">三类证据独立建模后汇合；规则、分数与 gate 都由确定性代码给出。</tspan>
  </text>
  <g>
    <rect x="40" y="151" width="118" height="30" rx="15" fill="#E8F2ED"/>
    <text x="99" y="171" class="pill" fill="#2F6B55" text-anchor="middle">差异事实</text>
  </g>
  <g>
    <rect x="168" y="151" width="116" height="30" rx="15" fill="#EAF0F7"/>
    <text x="226" y="171" class="pill" fill="#1B365D" text-anchor="middle">PR 证据</text>
  </g>
  <g>
    <rect x="294" y="151" width="120" height="30" rx="15" fill="#F1EDF4"/>
    <text x="354" y="171" class="pill" fill="#6D587A" text-anchor="middle">仓库策略</text>
  </g>
  <g>
    <rect x="424" y="151" width="132" height="30" rx="15" fill="#F8E9EC"/>
    <text x="490" y="171" class="pill" fill="#7B3F4A" text-anchor="middle">运行时无 LLM</text>
  </g>
  <g>
    <rect x="28" y="195" width="664" height="445" rx="22" class="zone"/>
    <rect x="28" y="195" width="8" height="445" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="232" r="18" fill="#2F6B55"/>
    <text x="62" y="239" class="zone-index" text-anchor="middle">01</text>
    <text x="92" y="239" class="zone-title">三支输入通道</text>
    <text x="670" y="237" class="meta" text-anchor="end">各自解析 · 不混用</text>
  </g>
  <g>
    <rect x="52" y="260" width="190" height="96" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="70" y="290" class="card-title" fill="#2F6B55">代码差异</text>

  <text x="70" y="318" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">CLI：本地 Git diff</tspan><tspan x="70" dy="23">Action：GitHub PR diff</tspan>
  </text>

  </g>
  <g>
    <rect x="265" y="260" width="190" height="96" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="283" y="290" class="card-title" fill="#1B365D">PR 证据文本</text>

  <text x="283" y="318" class="card-detail" text-anchor="start">
    <tspan x="283" dy="0">标题 · 正文</tspan><tspan x="283" dy="23">复现 / 验证 / 截图说明</tspan>
  </text>

  </g>
  <g>
    <rect x="478" y="260" width="190" height="96" rx="14" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7" />
    <text x="496" y="290" class="card-title" fill="#6D587A">仓库配置</text>

  <text x="496" y="318" class="card-detail" text-anchor="start">
    <tspan x="496" dy="0">.proofpr.yml</tspan><tspan x="496" dy="23">preset · 阈值 · contracts</tspan>
  </text>

  </g>
  <path d="M 147 356 V 398" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 360 356 V 398" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 573 356 V 398" fill="none" stroke="#6D587A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <g>
    <rect x="52" y="410" width="190" height="112" rx="14" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7" />
    <text x="70" y="440" class="card-title" fill="#2F6B55">parseUnifiedDiff()</text>

  <text x="70" y="468" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">文件路径与增删行</tspan><tspan x="70" dy="23">新增行位置 · 变更规模</tspan>
  </text>
    <text x="70" y="508" class="note">输出 DiffFile[]</text>
  </g>
  <g>
    <rect x="265" y="410" width="190" height="132" rx="14" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7" />
    <text x="283" y="440" class="card-title" fill="#1B365D">PullRequest 证据对象</text>

  <text x="283" y="468" class="card-detail" text-anchor="start">
    <tspan x="283" dy="0">描述中的测试 / 复现</tspan><tspan x="283" dy="23">截图 / 验证 / 风险说明</tspan>
  </text>
    <text x="283" y="528" class="note">与 diff 事实并列进入规则</text>
  </g>
  <g>
    <rect x="478" y="410" width="190" height="132" rx="14" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7" />
    <text x="496" y="440" class="card-title" fill="#6D587A">配置加载与校验</text>

  <text x="496" y="468" class="card-detail" text-anchor="start">
    <tspan x="496" dy="0">YAML + Zod</tspan><tspan x="496" dy="23">路径匹配 · contracts</tspan><tspan x="496" dy="23">preset · 阈值</tspan>
  </text>
    <text x="496" y="528" class="note">输出 ProofPRConfig</text>
  </g><rect x="52" y="552" width="616" height="66" rx="12" fill="#F8E9EC"/><text x="70" y="579" class="card-title" fill="#7B3F4A">配置不是 diff</text><text x="210" y="579" class="card-detail">配置只改变规则与阈值，不进入 unified diff parser。</text><text x="70" y="605" class="note">代码事实、PR 描述证据、仓库策略以三种不同类型交给 core。</text>
  <g>
    <rect x="28" y="665" width="664" height="340" rx="22" class="zone"/>
    <rect x="28" y="665" width="8" height="340" rx="4" fill="#7B3F4A"/>
    <circle cx="62" cy="702" r="18" fill="#7B3F4A"/>
    <text x="62" y="709" class="zone-index" text-anchor="middle">02</text>
    <text x="92" y="709" class="zone-title">@proof-pr/core · 确定性规则引擎</text>
    <text x="670" y="707" class="meta" text-anchor="end">同输入 → 同结论</text>
  </g>
  <g>
    <rect x="112" y="720" width="112" height="30" rx="15" fill="#E8F2ED"/>
    <text x="168" y="740" class="pill" fill="#2F6B55" text-anchor="middle">DiffFile[]</text>
  </g>
  <g>
    <rect x="278" y="720" width="164" height="30" rx="15" fill="#EAF0F7"/>
    <text x="360" y="740" class="pill" fill="#1B365D" text-anchor="middle">PullRequest evidence</text>
  </g>
  <g>
    <rect x="496" y="720" width="132" height="30" rx="15" fill="#F1EDF4"/>
    <text x="562" y="740" class="pill" fill="#6D587A" text-anchor="middle">ProofPRConfig</text>
  </g>
  <path d="M 168 750 V 764" fill="none" stroke="#2F6B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 360 750 V 764" fill="none" stroke="#1B365D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M 562 750 V 764" fill="none" stroke="#6D587A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><g>
  <rect x="52" y="770" width="616" height="225" rx="18" fill="#FFFFFF" stroke="#7B3F4A" stroke-width="2"/>
  <text x="72" y="800" class="engine-title" fill="#7B3F4A">scanPullRequest()：产出 findings，再计算分数与 review decision</text>

  <g>
    <rect x="72" y="818" width="270" height="68" rx="12" fill="#E8F2ED"/>
    <text x="86" y="844" class="lens-title" fill="#2F6B55">证据完整度</text>
    <text x="86" y="867" class="lens-detail">测试 · 复现 · 截图 · Evidence Contract</text>
  </g>

  <g>
    <rect x="378" y="818" width="270" height="68" rx="12" fill="#EAF0F7"/>
    <text x="392" y="844" class="lens-title" fill="#1B365D">审查范围</text>
    <text x="392" y="867" class="lens-detail">改动规模 · 敏感路径 · 文件类型</text>
  </g>

  <g>
    <rect x="72" y="896" width="270" height="68" rx="12" fill="#FFF3DF"/>
    <text x="86" y="922" class="lens-title" fill="#9B682F">供应链</text>
    <text x="86" y="945" class="lens-detail">依赖版本 · lockfile · lifecycle · 来源</text>
  </g>

  <g>
    <rect x="378" y="896" width="270" height="68" rx="12" fill="#F8E9EC"/>
    <text x="392" y="922" class="lens-title" fill="#7B3F4A">安全执行面</text>
    <text x="392" y="945" class="lens-detail">secret · Workflow 权限 · MCP 配置</text>
  </g>
  <text x="72" y="976" class="note">finding 保留 ruleId、severity、message、建议，以及适用时的文件和新增行位置。</text>
</g>
  <g>
    <rect x="28" y="1030" width="664" height="240" rx="22" class="zone"/>
    <rect x="28" y="1030" width="8" height="240" rx="4" fill="#6D587A"/>
    <circle cx="62" cy="1067" r="18" fill="#6D587A"/>
    <text x="62" y="1074" class="zone-index" text-anchor="middle">03</text>
    <text x="92" y="1074" class="zone-title">可执行结论与多格式发布</text>
    <text x="670" y="1072" class="meta" text-anchor="end">给人审查，不替人审查</text>
  </g>
  <path d="M 322 1178 H 346" fill="none" stroke="#6D587A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><g>
  <rect x="52" y="1090" width="270" height="158" rx="15" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.8"/>
  <text x="70" y="1120" class="card-title" fill="#6D587A">ReviewResult</text>
  <text x="70" y="1145" class="card-detail">risk score · evidence score</text>
  <text x="70" y="1168" class="card-detail">findings · reviewPlan · gate</text>

  <g>
    <rect x="70" y="1178" width="58" height="23" rx="11.5" fill="#E8F2ED"/>
    <text x="99" y="1194" class="gate-label" fill="#2F6B55" text-anchor="middle">ready</text>
  </g>

  <g>
    <rect x="136" y="1178" width="112" height="23" rx="11.5" fill="#EAF0F7"/>
    <text x="192" y="1194" class="gate-label" fill="#1B365D" text-anchor="middle">review-carefully</text>
  </g>

  <g>
    <rect x="70" y="1208" width="112" height="23" rx="11.5" fill="#FFF3DF"/>
    <text x="126" y="1224" class="gate-label" fill="#9B682F" text-anchor="middle">needs-evidence</text>
  </g>

  <g>
    <rect x="190" y="1208" width="104" height="23" rx="11.5" fill="#F8E9EC"/>
    <text x="242" y="1224" class="gate-label" fill="#7B3F4A" text-anchor="middle">block-merge</text>
  </g>
</g>
  <g>
    <rect x="358" y="1090" width="310" height="158" rx="14" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7" />
    <text x="376" y="1120" class="card-title" fill="#6D587A">Reporters 与 GitHub Action</text>

  <text x="376" y="1148" class="card-detail" text-anchor="start">
    <tspan x="376" dy="0">Markdown · JSON · HTML · SARIF</tspan><tspan x="376" dy="23">Job Summary · PR 评论 · Annotations</tspan>
  </text>
    <text x="376" y="1234" class="note">相同结果模型，不同发布载体</text>
  </g><text x="40" y="1299" class="foot">ProofPR 判断的是“现有证据是否足以进入审查或合并”，并不宣称理解业务正确性。</text>
</svg>