<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1380" width="720" height="1380" role="img" aria-labelledby="title desc">
  <title id="title">Local AI Ops 健康检查与诊断架构图</title>
  <desc id="desc">图中先区分人工同步请求与每分钟扫描启用且到期计划的定时巡检，两者共同进入 Shared Check Runner。Runner 通过 HTTP、TCP、SSH、CloudMonitor 和 Cloud Assistant 适配器执行检查，并把结果写入 PostgreSQL，React 与 ECharts 从数据库读取状态和趋势。诊断仅由用户触发，读取资产、当前告警和最近五次结果并净化输入，随后使用已配置模型或本地规则生成建议，保存并展示建议，但不自动执行修复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202A44" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #1B365D; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; fill: #202A44; }
      .subtitle { font-size: 16px; font-weight: 520; fill: #5B6472; }
      .meta, .foot { font-size: 13px; font-weight: 650; fill: #5B6472; }
      .pill { font-size: 13px; font-weight: 800; }
      .section { fill: #FFFFFF; stroke: #CDD5DF; stroke-width: 1.5; filter: url(#shadow); }
      .section-index { font-size: 13px; font-weight: 900; fill: white; }
      .section-title { font-size: 20px; font-weight: 820; fill: #202A44; }
      .section-kicker { font-size: 12px; font-weight: 750; fill: #5B6472; }
      .card-title { font-size: 17px; font-weight: 820; }
      .card-detail { font-size: 14px; font-weight: 560; fill: #202A44; }
      .note { font-size: 11.5px; font-weight: 680; fill: #5B6472; }
      .badge { font-size: 11.5px; font-weight: 820; fill: white; }
      .edge { font-size: 11.5px; font-weight: 760; fill: #5B6472; }
      .strip { font-size: 12px; font-weight: 760; }
      .divider-label { font-size: 11.5px; font-weight: 720; fill: #8A93A1; }
    </style>
  </defs>
  <rect width="720" height="1380" rx="26" fill="#F7F8FA"/><text x="40" y="48" class="eyebrow">SYSTEM MAP · LOCAL AI OPS</text>
  <text x="40" y="86" class="title" text-anchor="start">
    <tspan x="40" dy="0">一次健康检查，怎样变成可解释的运维建议</tspan>
  </text>
  <text x="40" y="126" class="subtitle" text-anchor="start">
    <tspan x="40" dy="0">人工与定时任务共用执行器；诊断可以用模型，但不会自动修复。</tspan>
  </text>
  <g>
    <rect x="40" y="151" width="120" height="32" rx="16" fill="#EAF0F7"/>
    <text x="100" y="173" class="pill" fill="#1B365D" text-anchor="middle">人工同步请求</text>
  </g>
  <g>
    <rect x="170" y="151" width="120" height="32" rx="16" fill="#E8F2ED"/>
    <text x="230" y="173" class="pill" fill="#2F6B55" text-anchor="middle">定时到期巡检</text>
  </g>
  <g>
    <rect x="300" y="151" width="116" height="32" rx="16" fill="#F1EDF4"/>
    <text x="358" y="173" class="pill" fill="#6D587A" text-anchor="middle">统一落库</text>
  </g>
  <g>
    <rect x="426" y="151" width="128" height="32" rx="16" fill="#F8E9EC"/>
    <text x="490" y="173" class="pill" fill="#7B3F4A" text-anchor="middle">诊断只给建议</text>
  </g>
  <g>
    <rect x="28" y="195" width="664" height="430" rx="22" class="section"/>
    <rect x="28" y="195" width="8" height="430" rx="4" fill="#1B365D"/>
    <circle cx="62" cy="233" r="18" fill="#1B365D"/>
    <text x="62" y="240" class="section-index" text-anchor="middle">01</text>
    <text x="92" y="240" class="section-title">两种触发，共用一套检查执行器</text>
    <text x="668" y="238" class="section-kicker" text-anchor="end">控制面</text>
  </g>
  <g>
    <rect x="52" y="254" width="292" height="205" rx="17" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.6"/>
    <rect x="68" y="268" width="116" height="28" rx="14" fill="#1B365D"/>
    <text x="126" y="288" class="badge" text-anchor="middle">人工入口 · 同步</text>
  </g>
  <g>
    <rect x="72" y="304" width="112" height="93" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="90" y="337" class="card-title" fill="#1B365D">React</text>

  <text x="90" y="368" class="card-detail" text-anchor="start">
    <tspan x="90" dy="0">ECharts 界面</tspan><tspan x="90" dy="25">用户发起操作</tspan>
  </text>

  </g>
  <g>
    <rect x="212" y="304" width="112" height="93" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="230" y="337" class="card-title" fill="#1B365D">FastAPI</text>

  <text x="230" y="368" class="card-detail" text-anchor="start">
    <tspan x="230" dy="0">同一请求内</tspan><tspan x="230" dy="25">同步执行</tspan>
  </text>

  </g><path d="M 184 350 H 200" fill="none" stroke="#1B365D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="198" y="338" class="edge" text-anchor="middle">HTTP</text><text x="72" y="425" class="strip" fill="#1B365D">同步接口：资产同步 · 单次检查 · 诊断</text><text x="72" y="447" class="note">只有单次检查进入下方 Check Runner。</text>
  <g>
    <rect x="376" y="254" width="292" height="205" rx="17" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.6"/>
    <rect x="392" y="268" width="116" height="28" rx="14" fill="#2F6B55"/>
    <text x="450" y="288" class="badge" text-anchor="middle">定时入口 · 到期</text>
  </g>
  <g>
    <rect x="396" y="304" width="112" height="93" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="414" y="337" class="card-title" fill="#2F6B55">调度扫描</text>

  <text x="414" y="368" class="card-detail" text-anchor="start">
    <tspan x="414" dy="0">每分钟一次</tspan><tspan x="414" dy="25">enabled + due</tspan>
  </text>

  </g>
  <g>
    <rect x="536" y="304" width="112" height="93" rx="15" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>

    <text x="554" y="337" class="card-title" fill="#2F6B55">Celery</text>

  <text x="554" y="368" class="card-detail" text-anchor="start">
    <tspan x="554" dy="0">Redis 协调</tspan><tspan x="554" dy="25">Worker 执行</tspan>
  </text>

  </g><path d="M 508 350 H 524" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="522" y="338" class="edge" text-anchor="middle">派发</text><text x="396" y="425" class="strip" fill="#2F6B55">只负责已启用且到期的健康检查</text><text x="396" y="447" class="note">Celery / Redis 不承接人工同步动作。</text><g>
  <rect x="190" y="500" width="340" height="88" rx="18" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.8"/>
  <text x="360" y="533" class="card-title" fill="#6D587A" text-anchor="middle">Shared Check Runner</text>
  <text x="360" y="560" class="card-detail" text-anchor="middle">选择探针 · 执行检查 · 规范化结果</text>
  <text x="360" y="580" class="note" text-anchor="middle">触发方式不同，检查逻辑共用</text>
</g><path d="M 268 459 V 480 H 300 V 488" fill="none" stroke="#1B365D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 516 459 V 480 H 420 V 488" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="278" y="478" class="edge" text-anchor="end">单次检查</text><text x="360" y="612" class="strip" fill="#6D587A" text-anchor="middle">两条入口在这里汇合</text>
  <g>
    <rect x="28" y="645" width="664" height="360" rx="22" class="section"/>
    <rect x="28" y="645" width="8" height="360" rx="4" fill="#2F6B55"/>
    <circle cx="62" cy="683" r="18" fill="#2F6B55"/>
    <text x="62" y="690" class="section-index" text-anchor="middle">02</text>
    <text x="92" y="690" class="section-title">检查适配器统一执行，结果统一落库</text>
    <text x="668" y="688" class="section-kicker" text-anchor="end">执行面与数据面</text>
  </g><g>
  <rect x="52" y="705" width="300" height="236" rx="17" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.7"/>
  <text x="72" y="739" class="card-title" fill="#2F6B55">Check Runner · 五类探针</text>
  <text x="72" y="765" class="card-detail">按资产类型选择对应适配器</text>
  <rect x="72" y="790" width="116" height="42" rx="11" fill="#FFFFFF" stroke="#2F6B55"/><text x="130" y="817" class="strip" fill="#2F6B55" text-anchor="middle">HTTP</text>
  <rect x="206" y="790" width="116" height="42" rx="11" fill="#FFFFFF" stroke="#2F6B55"/><text x="264" y="817" class="strip" fill="#2F6B55" text-anchor="middle">TCP</text>
  <rect x="72" y="848" width="116" height="42" rx="11" fill="#FFFFFF" stroke="#2F6B55"/><text x="130" y="875" class="strip" fill="#2F6B55" text-anchor="middle">SSH</text>
  <rect x="206" y="848" width="116" height="42" rx="11" fill="#FFFFFF" stroke="#2F6B55"/><text x="264" y="875" class="strip" fill="#2F6B55" text-anchor="middle">CloudMonitor</text>
  <rect x="72" y="906" width="250" height="20" rx="10" fill="#FFFFFF" stroke="#2F6B55"/><text x="197" y="921" class="note" fill="#2F6B55" text-anchor="middle">Cloud Assistant</text>
</g>
  <g>
    <rect x="390" y="705" width="278" height="140" rx="15" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7"/>

    <text x="408" y="738" class="card-title" fill="#6D587A">PostgreSQL · 共享数据层</text>

  <text x="408" y="769" class="card-detail" text-anchor="start">
    <tspan x="408" dy="0">资产与计划</tspan><tspan x="408" dy="25">检查结果与告警</tspan><tspan x="408" dy="25">诊断建议</tspan>
  </text>

  </g><path d="M 352 808 H 378" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="365" y="796" class="edge" text-anchor="middle">写入</text>
  <g>
    <rect x="390" y="871" width="278" height="86" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="408" y="904" class="card-title" fill="#1B365D">React + ECharts</text>

  <text x="408" y="935" class="card-detail" text-anchor="start">
    <tspan x="408" dy="0">读取健康状态 · 趋势 · 告警</tspan>
  </text>

  </g><path d="M 529 845 V 859" fill="none" stroke="#1B365D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="552" y="861" class="edge">查询</text><g>
  <rect x="52" y="961" width="616" height="28" rx="9" fill="#EAF0F7"/>
  <text x="360" y="980" class="strip" fill="#1B365D" text-anchor="middle">页面看到的状态来自 PostgreSQL，而不是某个 Worker 的临时内存</text>
</g>
  <g>
    <rect x="28" y="1025" width="664" height="325" rx="22" class="section"/>
    <rect x="28" y="1025" width="8" height="325" rx="4" fill="#7B3F4A"/>
    <circle cx="62" cy="1063" r="18" fill="#7B3F4A"/>
    <text x="62" y="1070" class="section-index" text-anchor="middle">03</text>
    <text x="92" y="1070" class="section-title">诊断是用户触发的解释支路，不是自动修复</text>
    <text x="668" y="1068" class="section-kicker" text-anchor="end">可选模型</text>
  </g>
  <g>
    <rect x="52" y="1080" width="132" height="32" rx="16" fill="#F8E9EC"/>
    <text x="118" y="1102" class="pill" fill="#7B3F4A" text-anchor="middle">用户点击“诊断”</text>
  </g>
  <g>
    <rect x="52" y="1126" width="236" height="112" rx="15" fill="#EAF0F7" stroke="#1B365D" stroke-width="1.7"/>

    <text x="70" y="1159" class="card-title" fill="#1B365D">读取诊断上下文</text>

  <text x="70" y="1190" class="card-detail" text-anchor="start">
    <tspan x="70" dy="0">资产 + 当前告警</tspan><tspan x="70" dy="25">最近 5 次检查结果</tspan>
  </text>

  </g>
  <g>
    <rect x="320" y="1126" width="152" height="112" rx="15" fill="#F1EDF4" stroke="#6D587A" stroke-width="1.7"/>

    <text x="338" y="1159" class="card-title" fill="#6D587A">净化输入</text>

  <text x="338" y="1190" class="card-detail" text-anchor="start">
    <tspan x="338" dy="0">整理字段</tspan><tspan x="338" dy="25">过滤不安全内容</tspan>
  </text>

  </g><path d="M 288 1182 H 308" fill="none" stroke="#6D587A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><g>
  <rect x="504" y="1114" width="164" height="58" rx="13" fill="#E8F2ED" stroke="#2F6B55" stroke-width="1.6"/>
  <text x="586" y="1138" class="card-title" fill="#2F6B55" text-anchor="middle">已配置模型</text>
  <text x="586" y="1158" class="note" text-anchor="middle">调用模型生成建议</text>
  <rect x="504" y="1186" width="164" height="58" rx="13" fill="#FFF3DF" stroke="#9B682F" stroke-width="1.6"/>
  <text x="586" y="1210" class="card-title" fill="#9B682F" text-anchor="middle">未配置模型</text>
  <text x="586" y="1230" class="note" text-anchor="middle">使用本地规则建议</text>
</g><circle cx="488" cy="1182" r="5" fill="#6D587A"/><path d="M 488 1182 V 1143 H 492" fill="none" stroke="#2F6B55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 488 1182 V 1215 H 492" fill="none" stroke="#9B682F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="586" y="1099" class="edge" text-anchor="middle" fill="#6D587A">二选一：按模型配置走其中一条</text><g>
  <rect x="52" y="1263" width="616" height="65" rx="13" fill="#F8E9EC" stroke="#7B3F4A" stroke-width="1.6"/>
  <text x="72" y="1291" class="card-title" fill="#7B3F4A">建议写回 PostgreSQL → React / ECharts 展示</text>
  <text x="72" y="1316" class="card-detail">到此为止：系统保存解释与建议，不调用任何修复动作。</text>
</g><path d="M 668 1143 H 682 V 1249 H 624 V 1252" fill="none" stroke="#7B3F4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><path d="M 586 1244 V 1252" fill="none" stroke="#7B3F4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#arrow)"/><text x="40" y="1368" class="foot">实线：执行 / 数据流　·　双入口只在 Check Runner 汇合　·　诊断需要用户明确触发</text>
</svg>